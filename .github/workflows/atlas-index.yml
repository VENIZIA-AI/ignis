name: Atlas index
run-name: 'Atlas index | ${{ github.ref_name }}'

# Publishes the signed atlas index of each commit atlas can be asked for (main, develop and the release tags)
# to the release `atlas-index` of this repository, so a project that reads IGNIS as a source downloads it
# instead of building it. The private key is the Actions secret ATLAS_INDEX_KEY; its public half is
# `atlas.index.keys` in .configs/vulcan.config.mts. VULCAN's action refuses anything but a push to those refs
# and does nothing while the secret is empty. It is pinned by commit, the one of the installed VULCAN release.
#
# Known limit: the release workflow pushes its release commits and tags with the Actions token, and GitHub
# starts no workflow from those pushes, so a release tag of IGNIS gets no pair from this workflow. The next
# push to develop covers the head. VULCAN 0.4.7 makes its own release run the action; IGNIS gets that when it
# moves to it.
on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: atlas-index-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish the pair
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The release table is generated from release commits and tags; a shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # The action runs the project's installed atlas (`vulcan x atlas index publish`).
      - name: Install
        run: bun install

      - name: Publish the atlas index
        uses: VENIZIA-AI/vulcan/.github/actions/atlas-index@411757f4ff02e9ac285df288bb85218fec4c8e26 # v0.4.6
        env:
          ATLAS_INDEX_KEY: ${{ secrets.ATLAS_INDEX_KEY }}
