name: Docs
run-name: 'Docs · ${{ github.ref_name }}'

# Everything this repository publishes besides the packages, as jobs of one workflow, each with the trigger it had
# when it was a workflow of its own:
#
#   docs         a push to develop that touches docs/wiki/ builds the wiki and deploys it to GitHub Pages
#   atlas-index  a push to main, develop or a tag publishes the signed atlas index of that commit
#
# A manual run deploys the wiki, which is what the old deploy workflow did on a manual run:
#
#   gh workflow run deploy-docs.yml --ref develop
#
# The file keeps its name: the github-pages environment and the release docs name it.
on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Whether the wiki needs a deploy. A path filter on the trigger would also stop the atlas index on a push that does
  # not touch the wiki, so the filter is this check: a push to develop deploys when docs/wiki/ changed between the
  # old and the new head (and when the old head cannot be read), a manual run always deploys.
  changes:
    name: What changed
    runs-on: ubuntu-26.04
    outputs:
      docs: ${{ steps.docs.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Does the wiki need a deploy
        id: docs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          docs=false

          if [ "$EVENT" = "workflow_dispatch" ]; then
            docs=true
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/develop" ]; then
            if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              docs=true
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- docs/wiki; then
              docs=true
            fi
          fi

          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "docs job: $docs"

  build:
    name: Wiki Release
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Docs
        run: make docs

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/wiki/site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-26.04
    name: Deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  # Publishes the signed atlas index of each commit atlas can be asked for (main, develop and the release tags) to
  # the release `atlas-index` of this repository, so a project that reads IGNIS as a source downloads it instead of
  # building it. The private key is the Actions secret ATLAS_INDEX_KEY; its public half is `atlas.index.keys` in
  # .configs/vulcan.config.mts. VULCAN's action refuses anything but a push to those refs and does nothing while the
  # secret is empty. It is pinned by commit, the one of the installed VULCAN release.
  #
  # Known limit: the release workflow pushes its release commits and tags with the Actions token, and GitHub
  # starts no workflow from those pushes, so a release tag of IGNIS gets no pair from this job. The next
  # push to develop covers the head. VULCAN 0.4.7 makes its own release run the action; IGNIS gets that when it
  # moves to it.
  atlas-index:
    name: Publish the pair
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: atlas-index-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The release table is generated from release commits and tags; a shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # The action runs the project's installed atlas (`vulcan x atlas index publish`).
      - name: Install
        run: bun install

      - name: Publish the atlas index
        uses: VENIZIA-AI/vulcan/.github/actions/atlas-index@411757f4ff02e9ac285df288bb85218fec4c8e26 # v0.4.6
        env:
          ATLAS_INDEX_KEY: ${{ secrets.ATLAS_INDEX_KEY }}
