name: Docs
run-name: 'Docs · ${{ github.ref_name }}'

# Everything this repository publishes besides the packages, as jobs of one workflow, each with the trigger it had
# when it was a workflow of its own:
#
#   docs         a push to develop that touches docs/wiki/ builds the wiki and deploys it to GitHub Pages
#   atlas-index  a push to main, develop or a tag publishes the signed atlas index of that commit
#
# A manual run picks one job with `job` (default `docs`, which is what the old deploy workflow did):
#
#   gh workflow run deploy-docs.yml --ref develop
#   gh workflow run deploy-docs.yml --ref develop -f job=atlas-index -f ref=core-server-v0.4.7-4
#
# `job=atlas-index` publishes the pair and does not deploy the wiki.
#
# The file keeps its name: the github-pages environment and the release docs name it.
on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      job:
        type: choice
        description: 'Which job a manual run starts'
        options:
          - docs
          - atlas-index
        required: true
        default: 'docs'
      ref:
        type: string
        description: 'atlas-index only: a tag or a branch whose commit to publish instead of the one this run starts on (empty = the commit this run started on)'
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Whether the wiki needs a deploy. A path filter on the trigger would also stop the atlas index on a push that does
  # not touch the wiki, so the filter is this check: a push to develop deploys when docs/wiki/ changed between the
  # old and the new head (and when the old head cannot be read), a manual run deploys when it asked for `docs`.
  changes:
    name: What changed
    runs-on: ubuntu-26.04
    outputs:
      docs: ${{ steps.docs.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Does the wiki need a deploy
        id: docs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          JOB: ${{ inputs.job }}
        run: |
          docs=false

          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$JOB" = "docs" ] && docs=true
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/develop" ]; then
            if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              docs=true
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- docs/wiki; then
              docs=true
            fi
          fi

          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "docs job: $docs"

  build:
    name: Wiki Release
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Docs
        run: make docs

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/wiki/site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-26.04
    name: Deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  # Publishes the signed atlas index of each commit atlas can be asked for (main, develop and the release tags) to
  # the release `atlas-index` of this repository, so a project that reads IGNIS as a source downloads it instead of
  # building it. The private key is the Actions secret ATLAS_INDEX_KEY; its public half is `atlas.index.keys` in
  # .configs/vulcan.config.mts. VULCAN's action refuses anything but a push or a manual run, for those refs, and does
  # nothing while the secret is empty. It is pinned by commit, the one of the installed VULCAN release.
  #
  # The release workflow pushes its release commits and tags with the Actions token, and GitHub starts no workflow from
  # those pushes, so this job does not run for them on its own. A manual run makes the pair of one of them:
  # `-f job=atlas-index -f ref=<tag or branch>` publishes the pair of that commit (it must be on main or develop) and
  # deploys no wiki. The ref is never checked out: the action refuses a name that is not a plain tag or branch before it
  # builds anything.
  atlas-index:
    name: Publish the pair
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == 'atlas-index')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: atlas-index-${{ inputs.ref || github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The release table is generated from release commits and tags; a shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # The action runs the project's installed atlas (`vulcan x atlas index publish`).
      - name: Install
        run: bun install

      - name: Publish the atlas index
        uses: VENIZIA-AI/vulcan/.github/actions/atlas-index@6670969acce876a29c11d9f1da319992fdd3e282 # vulcan-v0.4.9-1
        with:
          ref: ${{ inputs.ref }}
        env:
          ATLAS_INDEX_KEY: ${{ secrets.ATLAS_INDEX_KEY }}
