name: CI
run-name: 'CI | ${{ github.event_name }} | ${{ github.head_ref || github.ref_name }}'

# Manual only, by decision. These gates are a full build, seven test suites, lint and the purity
# probe, and they used to fire on every pull request AND every push to develop - including the
# release workflow's own commits, so a four-package release chain paid for four extra full runs.
# Nothing enforces this workflow as a required status check, so running it on demand blocks nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gates:
    name: Source gates
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          # The release table is generated from release commits; a shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        id: install
        run: bun install

      - name: Dependency catalog
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make catalog-check

      - name: Knowledge bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make okf-check-strict

      - name: Agent setup (VULCAN)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make vulcan-sync vulcan-doctor

      - name: Browser purity probe
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make purity-test

      - name: Gate scripts' own tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test-scripts

  build-and-test:
    name: Build, test and lint
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          # The release table is generated from release commits; a shallow clone has none.
          fetch-depth: 0

      # The clean-install gate loads every sub-path under Node as well as Bun.
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        id: install
        run: bun install

      - name: Build
        id: build
        run: make build-all

      # Bun links a package bin only when its target exists, and the workspace bins (ignis-artifacts) point into dist - link them now that the build wrote it.
      - name: Link workspace bins
        run: bun install --frozen-lockfile

      # A published map must resolve without src/ in the tarball, or a Vite app warns once per file.
      - name: Sourcemaps are self-contained
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make build-checks

      # Boots each example that needs no external service and calls its endpoints against the build.
      - name: Examples smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun scripts/examples.ts smoke

      # Creates an app from the PACKED @venizia/ignis preset in a temp folder and runs its checks.
      - name: VULCAN preset smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make preset-smoke

      # The make targets own the test flags (BUN_TEST_FLAGS, default --parallel, implies --isolate),
      # so CI and a developer's `make test-<pkg>` run the very same command.
      - name: Test - inversion
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-inversion

      - name: Test - helpers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-helpers

      - name: Test - boot
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-boot

      - name: Test - kernel
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-kernel

      - name: Test - connectors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-connectors

      - name: Test - core-worker
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-core-worker

      - name: Test - core-server
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-core-server

      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make lint-all

      # The examples are not in make: artifacts, lint and typecheck of every example.
      - name: Lint - examples
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun scripts/examples.ts check

      # One loop, no allowlist: connectors' known-impure engine clients are waived inside
      # scripts/purity/manifest.ts, where the release workflow's `make purity-<pkg>` sees them too.
      # This step used to carry its own copy of that list, so the two gates could disagree - and did:
      # `make purity-connectors` could never pass, which failed a connectors release outright.
      - name: Browser purity
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for target in purity-inversion purity-filter purity-helpers purity-kernel purity-core-worker purity-connectors; do
            make "$target" || failed=1
          done
          exit $failed

      # Packed tarballs, an empty project, only the peers a sub-path is granted: the one place an
      # optional peer the workspace hoists is missing, as it is on a consumer's machine.
      - name: Clean install
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make clean-install
