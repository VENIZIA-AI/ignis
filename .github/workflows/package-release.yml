name: 'NPM Release'
run-name: 'NPM Release | plan: ${{ inputs.plan }} | build_mode: ${{ inputs.build_mode }} | commit: ${{ github.sha }}'

on:
  workflow_dispatch:
    inputs:
      plan:
        type: string
        description: 'The packages to release, name@version[,name@version...]: the folder under packages/ and the version it has now. scripts/release/release.ts prints it ready to paste. The run orders them itself.'
        required: true
      build_mode:
        type: choice
        description: 'Version bump type (patch | minor | major | pre*)'
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
        required: true
        default: 'prerelease'
      issue:
        type: string
        description: 'Issue number the release commits serve (prefixes each with [#N])'
        required: false
        default: ''

# ONE run releases the whole plan. The packages are released one after the other in dependency order by
# scripts/release/release-run.ts (the `publish` job): for each, bump, pack, check, publish, wait until the
# tarball answers 200, then the release commit and the tag. A run that stops is continued by dispatching the same
# plan again: what is released is skipped, what is on npm without its commit or tag is recorded without a second
# publish, and a stale plan stops the run before anything is published.
#
# A DEPENDENCY RANGE IS NOT A CONTRACT ABOUT CONTENTS. The registry check below asks whether a version exists, not
# what it exports. When a change adds an export to `helpers`, put `helpers` AND every package that calls the new
# symbol in the plan, so that the floor is raised in the same run. Otherwise a consumer resolves the old tarball and
# dies at runtime on a symbol that exists only in this repository.

# Read-only by default. The job that pushes the release commits and the tags states its own write access; the jobs
# that plan and test hold no secret and cannot write. The release publishes only when every gate passed and only
# from develop, and every job works on the dispatched commit (`github.sha`), so the plan, the tests, the run name
# and the publish all name the same code.
permissions:
  contents: read

# One release at a time, repository-wide. A release mutates a shared branch and the registry, and the packages
# form a dependency chain, so two runs must never interleave. `cancel-in-progress: false` makes a second dispatch
# WAIT rather than kill a run that is mid-publish.
concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUILD_MODE: ${{ github.event.inputs.build_mode }}
  # The tarballs the release job packs and publishes: one folder inside the workspace. Absolute, because npm reads
  # `.agents/x/y.tgz` as a package spec and `/abs/y.tgz` as a file.
  TARBALLS: ${{ github.workspace }}/.agents/local/tmp/release-tarballs

jobs:
  # ---------------------------------------------------------------------------------------------
  # PLAN - no secret, no write access, no environment: checks the plan input and orders it. The input is text that
  # anybody who may dispatch can type, so the other jobs get this job's output, never the input.
  # ---------------------------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
      kind: ${{ steps.plan.outputs.kind }}
      branch: ${{ steps.plan.outputs.branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Exact, so a new bun cannot change what a release does. Raising it is a pull request of its own.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Plan the release
        id: plan
        env:
          PLAN: ${{ inputs.plan }}
        run: bun scripts/release/release-run.ts plan

  # ---------------------------------------------------------------------------------------------
  # TEST - one job per package of the plan; no secret, no write access: everything that must pass before a
  # version leaves the building. A failing job publishes nothing.
  # ---------------------------------------------------------------------------------------------
  test:
    name: Test ${{ matrix.package }}
    needs: plan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PACKAGE: ${{ matrix.package }}

    steps:
      # -------------------------------------------------------------------------
      # SETUP
      # -------------------------------------------------------------------------
      # The dispatched commit, never a branch name: the tests, the run name and the publish see one commit.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Exact, so a new bun cannot change what a release does. Raising it is a pull request of its own.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      # -------------------------------------------------------------------------
      # PREPARE
      # -------------------------------------------------------------------------
      - name: Get package info
        run: |
          PACKAGE_PATH="packages/$PACKAGE"
          PACKAGE_NAME=$(jq -r .name "$PACKAGE_PATH/package.json")
          CURRENT_VERSION=$(jq -r .version "$PACKAGE_PATH/package.json")

          echo "PACKAGE_PATH=$PACKAGE_PATH" >> $GITHUB_ENV
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

          echo "┌─────────────────────────────────────────────────"
          echo "│ Package:     $PACKAGE_NAME"
          echo "│ Path:        $PACKAGE_PATH"
          echo "│ Version:     $CURRENT_VERSION → $BUILD_MODE"
          echo "└─────────────────────────────────────────────────"

      # BEFORE the install, and across the WHOLE workspace - not just the package being tested.
      #
      # Before the install, because `force-update` rewrites the internal version ranges and an
      # install that ran first has already resolved the OLD ones. When a sibling moves past a
      # declared range, that range stops covering the workspace copy, so bun downloads the published
      # tarball instead of linking the source tree, and the build silently type-checks against a
      # package one release behind: 15 x TS2305 on `@venizia/ignis-helpers/core` cost one run.
      #
      # Across the whole workspace, because `bun install` resolves every member, so ANY package with
      # a stale range fails the run - even one the release does not touch.
      - name: Force update workspace
        run: bun run --filter "@venizia/*" force-update workspace

      - name: Install
        run: bun install

      # Every `@venizia/*` dependency is a member of this workspace, so resolving one to a registry
      # tarball is always wrong: it means the declared range excludes the version sitting in the
      # tree, and the build is validating code that is not in this repository. The failure mode is
      # invisible otherwise - install succeeds, and the lie surfaces as unrelated-looking type errors.
      - name: Assert internal dependencies link to the workspace
        run: |
          cd $PACKAGE_PATH
          bun -e '
            const { existsSync, readFileSync, realpathSync } = require("fs");
            const { join, sep } = require("path");

            const root = process.env.GITHUB_WORKSPACE;
            const manifest = JSON.parse(readFileSync("package.json", "utf8"));
            const internal = Object.keys({ ...manifest.dependencies, ...manifest.devDependencies })
              .filter((name) => name.startsWith("@venizia/"))
              .sort();

            const strays = [];
            for (const name of internal) {
              const found = [join(process.cwd(), "node_modules", name), join(root, "node_modules", name)]
                .find((path) => existsSync(path));

              if (!found) {
                strays.push(name + " - declared but not installed");
                continue;
              }

              const real = realpathSync(found);
              if (!real.includes(sep + "node_modules" + sep)) { continue; }

              const range = manifest.dependencies?.[name] ?? manifest.devDependencies?.[name];
              const version = JSON.parse(readFileSync(join(real, "package.json"), "utf8")).version;
              strays.push(name + " - range " + range + " pulled the published " + version + " instead of the workspace copy");
            }

            if (strays.length > 0) {
              console.error("ERROR: internal dependencies resolved to the registry, not this workspace:");
              for (const entry of strays) { console.error("  " + entry); }
              console.error("Raise the range so it covers the version in packages/, then re-run.");
              process.exit(1);
            }

            console.log("    ✓ all " + internal.length + " internal dependencies link to the workspace");
          '

      # -------------------------------------------------------------------------
      # BUILD, LINT & VALIDATE (uses Makefile dependency chain)
      # -------------------------------------------------------------------------
      - name: Build
        run: make $PACKAGE

      - name: Lint
        run: make lint-$PACKAGE

      # The gate's own regression tests run first: a probe that silently stopped detecting anything
      # would leave every `purity-*` target green for the wrong reason.
      - name: Purity probe self-test
        run: make purity-test

      - name: Purity gate
        run: make purity-$PACKAGE

      # The packed tarball in an empty project, with only the peers each sub-path is granted - an
      # optional peer the workspace hoists but a consumer never installs fails here, not on their machine.
      - name: Clean-install gate
        run: make clean-install-$PACKAGE

      # Derived from the package's own `exports` map, never a hand-written list. The list this
      # replaced named three dual-build packages by hand and went stale the day four more were dual
      # built: `helpers` then looked for `dist/index.js`, which its build stopped emitting, and the
      # release died here. Checking every PUBLISHED target is also strictly stronger than checking
      # one index - a sub-path whose file never got emitted fails here instead of at a consumer's
      # first import.
      - name: Sourcemaps are self-contained
        run: make build-checks

      - name: Validate build artifacts
        run: |
          cd $PACKAGE_PATH
          bun -e '
            const { existsSync, readFileSync } = require("fs");
            const manifest = JSON.parse(readFileSync("package.json", "utf8"));

            if (!manifest.exports) {
              console.error("ERROR: no `exports` map - there is nothing to validate against");
              process.exit(1);
            }

            const targets = new Set();
            for (const target of Object.values(manifest.exports)) {
              if (typeof target === "string") { targets.add(target); continue; }
              for (const file of Object.values(target)) targets.add(file);
            }

            const missing = [...targets].filter((file) => !existsSync(file));
            if (missing.length > 0) {
              console.error("ERROR: `exports` names files the build did not emit:");
              for (const file of missing) console.error(`  ${file}`);
              process.exit(1);
            }

            console.log(`    ✓ all ${targets.size} published entries exist`);
          '

      - name: Check dependency catalog
        run: make catalog-check

      # Packed once, read by every validator below. Packing per check ran the same work twice, and
      # the point of the checks is that they all see the SAME manifest - the one npm receives, not
      # the one in the working tree.
      - name: Pack the release tarball
        run: |
          cd $PACKAGE_PATH
          bun pm pack --quiet > /dev/null
          TARBALL=$(ls -t ./*.tgz | head -1)
          tar -xzOf "$TARBALL" package/package.json > "$RUNNER_TEMP/packed-manifest.json"
          rm -f "$TARBALL"

          echo "    ✓ extracted the manifest from $TARBALL"

      - name: Validate packed manifest
        run: |
          MANIFEST=$(cat "$RUNNER_TEMP/packed-manifest.json")

          if echo "$MANIFEST" | grep -qE '"(catalog|workspace):'; then
            echo "ERROR: unresolved workspace protocol survives into the published manifest:"
            echo "$MANIFEST" | grep -nE '"(catalog|workspace):'
            exit 1
          fi

          echo "    ✓ the packed manifest resolves every protocol"

      # The check above only rejects an *unresolved* protocol. A `workspace:*` on a package that was
      # never published resolves cleanly to a literal version while packing, so the tarball ships a
      # manifest naming a package the registry has never heard of and every `npm install` of the
      # release fails. `force-update.sh` cannot catch it either - `npm view` returns nothing and it
      # logs SKIP. This step asks the registry directly, for every runtime dependency. A sibling
      # released minutes ago may not be in the packument yet: its tarball answering 200 counts.
      - name: Validate dependencies exist on the registry
        run: bun scripts/release/release-run.ts registry "$RUNNER_TEMP/packed-manifest.json"

      # An app created from the PACKED preset typechecks, lints, passes its test and answers /api/hello.
      # Before the bump and the publish: a preset that cannot create a working app must not ship.
      - name: VULCAN preset smoke
        if: ${{ env.PACKAGE == 'core-server' }}
        # The VULCAN version this repository declares, never `latest`.
        run: |
          VULCAN_CMD="bun x @venizia/vulcan@$(jq -r '.devDependencies["@venizia/vulcan"]' package.json)" make preset-smoke

      # The package's own unit tests, before a version is cut. A package without a test target (`filter`) says so.
      - name: Unit tests
        run: |
          if make -n test-$PACKAGE > /dev/null 2>&1; then
            make test-$PACKAGE
          else
            echo "No test target for $PACKAGE"
          fi

  # ---------------------------------------------------------------------------------------------
  # SCRIPTS - once per run, not once per package: the repository scripts' own tests, the release workflow guards
  # among them. A develop head that dropped a guard (the provenance flag, the checksum, the token rule) stops here,
  # before a version is cut. No secret, no write access.
  # ---------------------------------------------------------------------------------------------
  scripts:
    name: Test the repository scripts
    needs: plan
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Exact, so a new bun cannot change what a release does. Raising it is a pull request of its own.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Force update workspace
        run: bun run --filter "@venizia/*" force-update workspace

      - name: Install
        run: bun install

      # The tests of the scripts read the built dev-configs, nothing else.
      - name: Build dev-configs
        run: make dev-configs

      - name: Test the repository scripts
        run: make test-scripts

  # ---------------------------------------------------------------------------------------------
  # PUBLISH - needs every gate, runs only from develop, and is the only job with write access.
  # It holds no registry token: npm trusted publishing signs in with the job's own identity.
  # ---------------------------------------------------------------------------------------------
  publish:
    name: NPM Release
    needs: [plan, test, scripts]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-26.04
    # Nine publishes, each followed by a wait of up to fifteen minutes for its tarball, plus the build.
    timeout-minutes: 240
    # The environment holds the release's ref rule (develop and main). Its settings are GitHub's, not this file's;
    # this line is what makes the job subject to them, and what a trusted publisher on npmjs.com names.
    environment: npm-release
    # `id-token` is what trusted publishing signs with: npm exchanges the job's identity for a short-lived publish
    # credential. Only this job has it.
    permissions:
      contents: write
      id-token: write

    steps:
      # -------------------------------------------------------------------------
      # SETUP
      # -------------------------------------------------------------------------
      # The dispatched commit, never a branch name: the tests, the run name and the publish see one commit. The
      # release commits are pushed to develop one at a time with a plain push; a push that is rejected (develop
      # moved) stops the run, and dispatching the same plan again records what is missing.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Exact, so a new bun cannot change what a release does. Raising it is a pull request of its own.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Setup Git
        run: |
          git config user.name "venizia-ci"
          git config user.email "developer@venizia.ai"

      # Trusted publishing needs npm 11.5.1 or later to publish and 11.21.0 or later to move a dist-tag; the npm
      # that ships with this Node is older. An exact version, never `latest`, asserted.
      - name: Install the npm that publishes
        run: |
          npm install --global npm@11.21.1 --ignore-scripts
          [ "$(npm --version)" = "11.21.1" ] || { echo "ERROR | npm is $(npm --version), expected 11.21.1"; exit 1; }

      # See the test job: before the install, across the whole workspace.
      - name: Force update workspace
        run: bun run --filter "@venizia/*" force-update workspace

      - name: Install
        run: bun install

      # Once, for all nine packages: the build does not depend on the version a release gives, and a package built
      # inside the loop would rebuild its dependencies for nothing. `core-server` builds the chain up to itself,
      # `core-worker` and `boot` hang off it.
      - name: Build
        run: make core-server core-worker boot

      # -------------------------------------------------------------------------
      # RELEASE - the loop
      # -------------------------------------------------------------------------
      # Per package: bump, pack, check the manifest and the checksum, publish the packed file with provenance, wait
      # until its tarball answers 200, move the dist-tags, then the release commit, the push and the tag. The
      # publish is the only step that cannot be undone, so git is written only after the package is installable:
      # after any stop, git equals the registry. Reported, never repaired: npm cannot un-publish, and force-pushing
      # develop to chase a live version does more damage than the gap.
      - name: Release the plan
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          TARGET_BRANCH: ${{ needs.plan.outputs.branch }}
          RELEASE_ISSUE: ${{ inputs.issue }}
        run: bun scripts/release/release-run.ts run
