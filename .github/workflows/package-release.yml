name: "NPM Release"
run-name: "NPM Release | package: ${{ inputs.package }} | build_mode: ${{ inputs.build_mode }}"

on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        description: Package to release
        options:
          - dev-configs
          - inversion
          - filter
          - helpers
          - boot
          - kernel
          - connectors
          - core-server
          - core-worker
          - docs-mcp
        required: true
      build_mode:
        type: choice
        description: "Version bump type (patch | minor | major | pre*)"
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
        required: true
        default: "patch"

# Build order comes from the Makefile chain (dev-configs -> inversion -> {filter, helpers} -> {boot, kernel} -> connectors -> {core-server, core-worker}); per-package dist dirs are in the `case` below. `kernel` sits beside `boot`, not after it. `core-server` (published as `@venizia/ignis`) depends on `kernel` AND `connectors` by version range, so both must be published first or the registry-existence check fails. `core-worker` depends on `kernel` only.
#
# A DEPENDENCY RANGE IS NOT A CONTRACT ABOUT CONTENTS. The registry-existence step below checks that a
# version exists, not what it exports, and `force-update highest` can only rewrite to the highest
# PUBLISHED version - so it cannot lift a floor for a package whose new exports are not out yet. When
# a change adds an export to `helpers`, bump `helpers` AND raise the floor in every package that calls
# the new symbol, and release `helpers` first. Otherwise a consumer resolves the old tarball and dies
# at runtime on a symbol that exists only in this repository.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PACKAGE: ${{ github.event.inputs.package }}
  BUILD_MODE: ${{ github.event.inputs.build_mode }}

jobs:
  release:
    name: NPM Release
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------------
      # SETUP
      # -------------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Git
        run: |
          git config user.name "venizia-ci"
          git config user.email "developer@venizia.ai"

      # -------------------------------------------------------------------------
      # PREPARE
      # -------------------------------------------------------------------------
      - name: Get package info
        run: |
          # Map package input to actual folder path
          case $PACKAGE in
            docs-mcp)  PACKAGE_PATH="docs/wiki" ;;
            *)         PACKAGE_PATH="packages/$PACKAGE" ;;
          esac

          PACKAGE_NAME=$(jq -r .name "$PACKAGE_PATH/package.json")
          CURRENT_VERSION=$(jq -r .version "$PACKAGE_PATH/package.json")

          # Set dist directories for validation
          case $PACKAGE in
            docs-mcp)        DIST_DIRS="dist/mcp-server" ;;
            inversion|filter|boot)  DIST_DIRS="dist/cjs dist/esm" ;;
            *)               DIST_DIRS="dist" ;;
          esac

          echo "PACKAGE_PATH=$PACKAGE_PATH" >> $GITHUB_ENV
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "DIST_DIRS=$DIST_DIRS" >> $GITHUB_ENV

          echo "┌─────────────────────────────────────────────────"
          echo "│ Package:     $PACKAGE_NAME"
          echo "│ Path:        $PACKAGE_PATH"
          echo "│ Version:     $CURRENT_VERSION → $BUILD_MODE"
          echo "│ Dist:        $DIST_DIRS"
          echo "└─────────────────────────────────────────────────"

      - name: Install
        run: bun install

      - name: Force update package
        run: bun run --filter "$PACKAGE_NAME" force-update "highest"

      # -------------------------------------------------------------------------
      # BUILD, LINT & VALIDATE (uses Makefile dependency chain)
      # -------------------------------------------------------------------------
      - name: Build
        run: make $PACKAGE

      - name: Lint
        run: make lint-$PACKAGE

      # The gate's own regression tests run first: a probe that silently stopped detecting anything
      # would leave every `purity-*` target green for the wrong reason.
      - name: Purity
        run: |
          make purity-test
          make purity-$PACKAGE

      - name: Validate build artifacts
        run: |
          cd $PACKAGE_PATH
          for dir in $DIST_DIRS; do
            [ -f "$dir/index.js" ] && [ -f "$dir/index.d.ts" ] || { echo "ERROR: $dir missing files"; exit 1; }
            echo "    ✓ $dir"
          done

      - name: Check dependency catalog
        run: make catalog-check

      # Manifests carry `catalog:` on purpose; only `bun publish` resolves it while packing, so this asserts both that the publisher is still bun and that the tarball it uploads is actually clean.
      - name: Validate packed manifest
        run: |
          grep -q 'bun publish' "$GITHUB_WORKSPACE/.github/workflows/package-release.yml" \
            || { echo "ERROR: the publish step must use 'bun publish' - npm ships catalog: verbatim"; exit 1; }

          cd $PACKAGE_PATH
          bun pm pack --quiet > /dev/null
          TARBALL=$(ls -t ./*.tgz | head -1)

          MANIFEST=$(tar -xzOf "$TARBALL" package/package.json)
          rm -f "$TARBALL"

          if echo "$MANIFEST" | grep -qE '"(catalog|workspace):'; then
            echo "ERROR: unresolved workspace protocol survives into the published manifest:"
            echo "$MANIFEST" | grep -nE '"(catalog|workspace):'
            exit 1
          fi

          echo "    ✓ publisher is bun and the packed manifest resolves every protocol"

      # The check above only rejects an *unresolved* protocol. A `workspace:*` on a package that was
      # never published resolves cleanly to a literal version while packing, so the tarball ships a
      # manifest naming a package the registry has never heard of and every `npm install` of the
      # release fails. `force-update.sh` cannot catch it either - `npm view` returns nothing and it
      # logs SKIP. This step asks the registry directly, for every runtime dependency.
      - name: Validate dependencies exist on the registry
        run: |
          cd $PACKAGE_PATH
          bun pm pack --quiet > /dev/null
          TARBALL=$(ls -t ./*.tgz | head -1)
          MANIFEST=$(tar -xzOf "$TARBALL" package/package.json)
          rm -f "$TARBALL"

          MANIFEST="$MANIFEST" bun -e '
            const dependencies = Object.entries(JSON.parse(process.env.MANIFEST).dependencies ?? {});
            const missing = [];

            for (const [name, range] of dependencies) {
              let packument;
              try {
                const response = await fetch(`https://registry.npmjs.org/${name}`);
                if (!response.ok) {
                  missing.push(`${name}@${range} - the package itself is not on the registry (HTTP ${response.status})`);
                  continue;
                }
                packument = await response.json();
              } catch (error) {
                // A network failure is not "package not found" - it must still fail the release, not be waved through.
                missing.push(`${name}@${range} - could not reach the registry (${error.message})`);
                continue;
              }

              const versions = Object.keys(packument.versions ?? {});
              const satisfied = versions.some((version) => Bun.semver.satisfies(version, range));
              if (!satisfied) {
                missing.push(`${name}@${range} - no published version satisfies this range`);
              }
            }

            if (missing.length > 0) {
              console.error("ERROR: the packed manifest depends on something the registry cannot serve:");
              for (const entry of missing) {
                console.error(`  - ${entry}`);
              }
              process.exit(1);
            }

            console.log(`    ✓ all ${dependencies.length} runtime dependencies resolve on the registry`);
          '

      # -------------------------------------------------------------------------
      # VERSION & GIT
      # -------------------------------------------------------------------------
      - name: Version bump
        run: |
          cd $PACKAGE_PATH
          npm version $BUILD_MODE --no-git-tag-version --workspaces-update=false

          NEW_VERSION=$(jq -r .version package.json)
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$PACKAGE-v$NEW_VERSION" >> $GITHUB_ENV
          echo ">>> New version: $NEW_VERSION"

      - name: Commit & Push
        run: |
          cd $PACKAGE_PATH
          git fetch origin && git checkout develop && git pull origin develop
          git add package.json
          git commit -m "chore($PACKAGE): release v$NEW_VERSION [$BUILD_MODE]"
          git push origin develop
          echo "IS_PUSHED=true" >> $GITHUB_ENV

      - name: Create tag
        run: |
          git tag -a "$TAG_NAME" -m "$PACKAGE_NAME v$NEW_VERSION"
          git push origin "$TAG_NAME"
          echo "IS_TAG_CREATED=true" >> $GITHUB_ENV

      # -------------------------------------------------------------------------
      # PUBLISH
      # -------------------------------------------------------------------------
      - name: Publish to NPM
        run: |
          cd $PACKAGE_PATH

          case $BUILD_MODE in
            patch|minor|major) NPM_TAG="latest" ;;
            *)                 NPM_TAG="next" ;;
          esac

          # BEFORE the publish, not after: a publish that succeeds and loses its response leaves npm
          # permanently holding the version while this step fails, and the rollback would then say
          # nothing about a release that is live. `$GITHUB_ENV` is read by LATER steps, so writing it
          # first changes nothing else. The flag means "a publish was attempted", which is what the
          # rollback advice needs.
          echo "IS_PUBLISHED=true" >> $GITHUB_ENV

          # `bun publish`, not npm: bun resolves `catalog:`/`workspace:` while packing, npm ships them verbatim and breaks every consumer. --ignore-scripts skips the already-run prepublishOnly.
          bun publish --access public --tag $NPM_TAG --ignore-scripts

          echo "✓ Published $PACKAGE_NAME@$NEW_VERSION ($NPM_TAG)"
        env:
          # NPM_CONFIG_TOKEN, not NODE_AUTH_TOKEN: bun ignores the NPM_CONFIG_USERCONFIG path that actions/setup-node writes its .npmrc to, and does not read NODE_AUTH_TOKEN or BUN_AUTH_TOKEN - measured, all three fail with "missing authentication".
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Tag highest version on NPM
        run: |
          # Publishes are monotonic, so the just-published version is always the highest (semver: x.y.z > x.y.z-N) - point `highest` at it for the README badge, non-fatally so a tagging hiccup never rolls back a successful publish.
          npm dist-tag add "$PACKAGE_NAME@$NEW_VERSION" highest \
            && echo "✓ Tagged $PACKAGE_NAME@$NEW_VERSION as 'highest'" \
            || echo "⚠️  Could not set 'highest' dist-tag (non-fatal)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      # -------------------------------------------------------------------------
      # ROLLBACK
      # -------------------------------------------------------------------------
      - name: Rollback on failure
        if: failure()
        run: |
          echo ">>> ROLLBACK STARTED"

          [ "$IS_TAG_CREATED" == "true" ] && {
            git push --delete origin "$TAG_NAME" 2>/dev/null || true
            git tag -d "$TAG_NAME" 2>/dev/null || true
          }

          # A blind `reset --hard HEAD~1 && push --force` erases whatever is on develop, and one
          # change is now a 4-package chain, so overlapping dispatches are the normal case: kernel
          # pushes K, connectors pushes C, kernel's publish fails, and this used to delete C - while
          # connectors is already published against a kernel version that would stop existing.
          # develop is only reset when its remote tip IS this run's own release commit.
          if [ "$IS_PUSHED" == "true" ]; then
            EXPECTED_SUBJECT="chore($PACKAGE): release v$NEW_VERSION [$BUILD_MODE]"

            git fetch origin develop
            ACTUAL_SUBJECT=$(git log -1 --format=%s origin/develop)

            if [ "$ACTUAL_SUBJECT" == "$EXPECTED_SUBJECT" ]; then
              # --force-with-lease, not --force: the fetch above and the push below are not atomic,
              # and a dispatch landing between them must lose the race loudly.
              git checkout develop
              git reset --hard origin/develop~1
              git push --force-with-lease origin develop
              echo "    ✓ reverted this run's release commit from develop"
            else
              echo "⚠️  develop has moved on - LEAVING IT ALONE"
              echo "    expected tip: $EXPECTED_SUBJECT"
              echo "    actual tip:   $ACTUAL_SUBJECT"
              echo "    revert this run's commit by hand: git revert <sha of \"$EXPECTED_SUBJECT\">"
            fi
          fi

          echo ">>> ROLLBACK COMPLETED"

          if [ "$IS_PUBLISHED" == "true" ]; then
            echo "⚠️  A publish of $PACKAGE_NAME@$NEW_VERSION was ATTEMPTED - check the registry before assuming it failed"
            echo "    if it is live: npm deprecate $PACKAGE_NAME@$NEW_VERSION 'Accidental release'"
          fi
