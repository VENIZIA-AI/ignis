services:
  typesense:
    image: typesense/typesense:27.1
    restart: on-failure
    ports:
      - '8108:8108'
    volumes:
      - typesense-data:/data
    command: '--data-dir /data --api-key=xyz --enable-cors'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8108/health']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  typesense-data:
