  upgrade:
    before: |
      import { isEmpty, uuidV4, sleep } from '@venizia/ignis-helpers';

      if (!isEmpty({ value: payload })) {
        const id = uuidV4();
        await sleep(100);
      }
    after: |
      import { ObjectUtility, PromiseUtility, UuidV4Generator } from '@venizia/ignis-helpers';

      if (!ObjectUtility.isEmpty({ value: payload })) {
        const id = UuidV4Generator.generate();
        await PromiseUtility.sleep({ ms: 100 });
      }
  downgrade:
    steps:
    - Move @venizia/ignis, -kernel, -helpers, -boot, -connectors, -worker and @venizia/dev-configs back to 0.4.6, and @venizia/ignis-inversion and @venizia/ignis-filter back to 0.4.5 (the versions the 0.4.6 line of the other packages pins).
    - Rename each call back to its bare function, using the pairs in the data field, and give the 39 options-object calls their positional arguments again (ObjectUtility.isEmpty({ value }) is isEmpty({ value }); PromiseUtility.sleep({ ms }) is sleep(ms)).
    - devz codemod namespace-functions has no reverse mode, so this is by hand.
