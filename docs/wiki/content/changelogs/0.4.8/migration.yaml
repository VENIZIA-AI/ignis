    steps:
      - "Require values read from the environment with applicationEnvironment.getRequired before passing them to IMailgunMailOptions config."
      - "Spread interface-typed values from mailgun.js when assigning them to TMailgunConfig."
  downgrade:
    steps:
      - "Pin @venizia/ignis to 0.4.7, or type the config as `any & { domain: string }` again."
