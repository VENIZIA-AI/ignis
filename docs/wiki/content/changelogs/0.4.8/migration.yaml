network-payloads-unknown:
  symbols: [IRequestOptions, BaseNetworkTcpClient, BaseNetworkTcpServer, ITcpSocketClient, ITcpSocketServerOptions, AxiosFetcher.send, ISocketIOServerBunOptions, SocketIOServerHelper.getEngine, SocketIOServerHelper.send, TSocketIOBunEngine, IHandshake, IOptions, SocketIOClientHelper, SocketIOBunHandler.createEngine, SocketIOBunHandler.createFetchHandler, RequestUtility.parseMultipartBody, IRequestedRemark]
  upgrade:
    before: |-
      const client = NetworkTcpClient.newInstance({
        identifier: 'tcp',
        options: { host, port },
        onError: (error) => console.log(error.message),
      });
      const engine = server.getEngine(); // any
      engine.handleRequest(request, bunServer);
      const options: IOptions = { path: '/io', extraHeaders: { 'x-attempt': 1 } };
      const response = await fetcher.send({ url, method: 'get' });
      const name: string = response.data.name; // data was any
    after: |-
      const client = NetworkTcpClient.newInstance({
        identifier: 'tcp',
        options: { host, port },
        onError: (error) => console.log(error instanceof Error ? error.message : String(error)),
      });
