jvalue-column-is-json-value:
  symbols: [PostgresDataTypeEnricher, SqliteDataTypeEnricher, TJsonValue]
  upgrade:
    before: |-
      const row = await repository.findById({ id: 1 });
      const label: string = row?.jValue?.label; // jValue was Record<string, any>

      // an interface-typed value (IMeta) was accepted
      interface IMeta { label: string }
      await repository.create({ data: { jValue: meta } });
    after: |-
      // jValue is TJsonValue (from '@venizia/ignis-helpers'): narrow what you read
      const value = row?.jValue;
      const label =
        typeof value === 'object' && value !== null && !Array.isArray(value) && typeof value.label === 'string'
