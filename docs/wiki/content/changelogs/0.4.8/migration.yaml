      // a test that sets a value of any type and restores what it read
      const previous: unknown = Reflect.get(applicationEnvironment, 'arguments')['APP_ENV_PORT'];
      applicationEnvironment.set('APP_ENV_PORT', 5432); // TS2345: number is not string | undefined
      applicationEnvironment.set('APP_ENV_PORT', previous); // TS2345: unknown is not string | undefined
    after: |-
      // get answers string | undefined: check a required variable where you read it
      const secret = applicationEnvironment.get('APP_ENV_JWT_SECRET');
      const port = applicationEnvironment.get('APP_ENV_PORT', { defaultValue: '3000' });
      // the second type argument is gone: the transform takes string | undefined
      const max = applicationEnvironment.get<number | undefined>('APP_ENV_POOL_MAX', {
        transform: (value) => (value ? Number(value) : undefined),
      });
      // the codemod lists these as manual: a union or literal type argument is dropped by hand
      // before: applicationEnvironment.get<string | undefined>('APP_ENV_X')
      // after:  applicationEnvironment.get('APP_ENV_X')
      // before: applicationEnvironment.get<'a' | 'b'>('APP_ENV_MODE')
      // after:  z.enum(['a', 'b']).parse(applicationEnvironment.get('APP_ENV_MODE'))
      // a defaultValue must be a string: get('APP_ENV_X', { defaultValue: maybeUndefined }) no longer compiles

      // convert in a transform: the value is a string
      // handle undefined in the transform: Number(undefined) is NaN, and NaN is not nullish, so a defaultValue would never apply
      const timeout = applicationEnvironment.get('APP_ENV_TIMEOUT', {
        transform: (raw) => (raw === undefined ? undefined : Number(raw)),
        defaultValue: 5000,
      });
      // ParseUtility.toNumber({ input: raw }) in the transform also refuses a value that is not a number, see parse-to-number

      // a default without a transform is a string; any other type needs the transform that makes it
      const retries = applicationEnvironment.get('APP_ENV_RETRIES', {
        transform: (raw) => (raw === undefined ? undefined : Number(raw)),
        defaultValue: 3,
      });
      const hosts = applicationEnvironment.get('APP_ENV_HOSTS', {
        transform: (raw) => ParseUtility.toDelimitedArray({ input: raw }),
        defaultValue: [],
      });

      // a variable the app cannot run without: an empty line (KEY=) reads as '' without a defaultValue, so treat it as unset too
      const host = applicationEnvironment.get('APP_ENV_DB_HOST');

      if (host === undefined || host.trim() === '') {
        throw new Error('APP_ENV_DB_HOST is not set');
      }

      // or, in one call: throws an error naming the key when it is unset or blank
      const required = applicationEnvironment.getRequired('APP_ENV_DB_HOST');

      // the store holds strings
      const environment = new ApplicationEnvironment({ prefix: 'APP_ENV', envs: { APP_ENV_PORT: '3000' } });
      applicationEnvironment.set('APP_ENV_RETRIES', '3');

      // set takes string | undefined, and get answers string | undefined: save with get, restore with set
      const previous = applicationEnvironment.get('APP_ENV_PORT');
      applicationEnvironment.set('APP_ENV_PORT', String(5432));
      applicationEnvironment.set('APP_ENV_PORT', previous);
    steps:
      - "Run `bun run devz codemod env-get [paths...] --write` (add `--numbers` to convert numeric reads with `ParseUtility.toNumber`) to remove obsolete type arguments from `applicationEnvironment.get` and `AppEnvs.get`."
      - "Convert skipped calls, non-string defaults, and custom types manually using `transform` or `ParseUtility` functions."
      - "Replace manual unset or empty checks for mandatory variables with `applicationEnvironment.getRequired`."
      - "Update `ApplicationEnvironment.set` calls and constructor `envs` maps to pass strings or `undefined`."
      - "Update any custom class implementing `IApplicationEnvironment` to match the four `get` overloads and the string-valued `set`."
  downgrade:
    steps:
      - Pin @venizia/ignis-helpers to 0.4.7 and put the type arguments back (get<string>(key), get<R, string>(key, { transform })), or restore the files from git, since the codemod has no reverse.
      - "A class that implements IApplicationEnvironment goes back to the older get<ReturnType, BeforeTransformType> and a set that returns any. Pass numbers or any value to the constructor and set again; the older store held any."
  data: "The old get<number>(key) returned the raw string at run time while its type said number, so code that compared it with a number or added to it behaved as a string operation. Check each call that carried a non-string type argument. Moving a read to a transform changes the value: with `bun run devz codemod env-get --numbers` (opt-in, it rewrites get<number>(key) and get<number>(key, { defaultValue }) to a transform that calls ParseUtility.toNumber) or by hand, a value that used to be a string at run time is a real number, an unset variable still gives undefined or the default, and a non-numeric value throws at the read instead of flowing on as a string. A boolean read stays manual, because the string 'false' is truthy. set returns void where it returned any, and takes string | undefined. A class that implements IApplicationEnvironment adds the four get overloads and the string-valued set. A value read with get() and passed to a library option that requires a string (drizzle-kit dbCredentials, a server config, a bucket name) is string | undefined now: read it with getRequired(key) or give get a defaultValue. The codemod is a style rewrite with no downgrade."

unusable-access-scope-unresolved:
  symbols: [IModelAccessSettings.resolve, ScopeFilters.UNRESTRICTED, ScopeFilterMissingBehaviors, ScopeResolution]
  upgrade:
    before: |
      // a resolver whose result was {} (or false, 0, '', []) or held an undefined value
      // applied no scope: the rows of every tenant were visible
      access: {
        resolve: () => ({ merchantId: currentUser()?.merchantId }),
      }
    after: |
      // every unusable result is "unresolved" and follows onMissing (deny by default)
      access: {
        resolve: () => {
          const merchantId = currentUser()?.merchantId;

          if (isOperator()) {
            return ScopeFilters.UNRESTRICTED; // the caller that must see everything
          }

          return merchantId ? { merchantId } : null; // null denies on purpose
        },
      }
    steps:
      - "Find every IModelAccessSettings.resolve function that returns false, 0, an empty string, an empty list, an empty object, or a where object with undefined values."
      - "Update the resolver to return a usable where object or null when denying access on purpose."
      - "Return ScopeFilters.UNRESTRICTED in the resolver for any caller that must see everything."
      - "Set onMissing to ScopeFilterMissingBehaviors.ALLOW only if an unresolved scope must keep applying no filter."
  downgrade:
    steps:
      - Pin @venizia/ignis-connectors and @venizia/ignis to 0.4.7, where a false, 0, empty string, empty list, {} or a where holding an undefined value is merged as it is and restricts nothing.
      - Keep the corrected resolver; it behaves the same on 0.4.7, so nothing has to be reverted in your code.
  data: Nothing stored changes. An app whose resolver returned one of those values now matches no rows on reads and refuses the writes, until the resolver returns a usable where or ScopeFilters.UNRESTRICTED. With onMissing set to ScopeFilterMissingBehaviors.ALLOW an unresolved scope still applies no filter; that opt-out is unchanged.

socketio-broadcast-authenticated-only:
  symbols: [SocketIOServerHelper.send, SocketIOServerHelper.getIOServer, SocketIOConstants.ROOM_AUTHENTICATED, SocketIOBindingKeys.SOCKET_IO_INSTANCE]
  upgrade:
    before: |
      // no destination: every connected socket got it, signed in or not
      helper.send({ payload: { topic: 'announcement', data: { text: 'Hello' } } });
    after: |
      // no destination now means SocketIOConstants.ROOM_AUTHENTICATED, which a socket joins after it authenticates.
      // Sockets that must receive a message before they authenticate join a room of your own. The helper is the
      // configured one the Socket.IO component binds at SocketIOBindingKeys.SOCKET_IO_INSTANCE:
      helper.getIOServer().on('connection', (socket) => socket.join('public-announcements'));

      helper.send({
        destination: 'public-announcements',
        payload: { topic: 'announcement', data: { text: 'Hello' } },
      });
    steps:
      - "Identify calls to SocketIOServerHelper.send without a destination that must still reach unauthenticated sockets."
      - "Obtain the configured helper bound at SocketIOBindingKeys.SOCKET_IO_INSTANCE and call helper.getIOServer to handle connection events."
      - "Join unauthenticated sockets to a custom room when connection events fire."
      - "Pass that custom room as the destination in SocketIOServerHelper.send for broadcasts targeting those unauthenticated sockets."
  downgrade:
    steps:
      - Pin @venizia/ignis-helpers to 0.4.7, where a send with no destination reaches every connected socket, authenticated or not.
      - The room you added for unauthenticated sockets is harmless on 0.4.7; keep it or drop it.
  data: Nothing stored changes. An authenticated socket joins SocketIOConstants.ROOM_AUTHENTICATED before the defaultRooms you configured, so a configuration that replaced the default rooms still receives broadcasts. A broadcast that used to reach a socket still waiting to authenticate no longer does.

websocket-handshake-before-established:
  symbols: [WebSocketServerHelper, TWebSocketHandshakeFn, WebSocketClientStates.AUTHENTICATING, WebSocketClientStates.AUTHENTICATED, WebSocketEvents.CONNECTED]
  upgrade:
    before: |
      // requireEncryption: true. The client sent its first message right after the authenticate
      // frame; on 0.4.7 the state was already AUTHENTICATED while handshakeFn ran, so it was accepted
      socket.send(JSON.stringify({ event: 'authenticate', data: { token } }));
      socket.send(JSON.stringify({ event: 'join', data: { rooms: ['orders'] } }));
    after: |
      // the client stays AUTHENTICATING until handshakeFn returns; wait for the connected event
      socket.send(JSON.stringify({ event: 'authenticate', data: { token } }));
      socket.addEventListener('message', (message) => {
        const frame = JSON.parse(message.data);

        if (frame.event === 'connected') {
          socket.send(JSON.stringify({ event: 'join', data: { rooms: ['orders'] } }));
        }
      });
    steps:
      - "Check every WebSocket client that connects to a server configured with requireEncryption true."
      - "Make it send messages and room joins only after it receives the connected event, not right after the authenticate frame."
  downgrade:
    steps:
      - Pin @venizia/ignis-helpers and @venizia/ignis to 0.4.7, where the client is AUTHENTICATED as soon as authenticateFn returns, before the encryption handshake finishes.
      - Or stay on the new version and send only after the connected event; that order works on 0.4.7 too.
  data: Nothing stored changes. Only a server with requireEncryption true is affected; without it the client is established at once, as before. A message or a room join sent before the handshake ends gets the error event with 'Not authenticated' and is not replayed.

http-datasource-path-guard:
  symbols: [HttpDataSource, HttpDataSource.request, HttpDataSource.buildUrl, IHttpDataSourceSettings.baseUrl]
  upgrade:
    before: |
      // a path built from an input could climb out of the base path
      const dataSource = new HttpDataSource({ name: 'api', baseUrl: 'https://api.example.com/v1' });

      await dataSource.request({ paths: ['files', fileName] }); // fileName '../../admin' reached /admin, outside the base path /v1
    after: |
      // a segment that is . or .. (percent-encoded too), or holds a backslash or a control character, answers 400:
      // check the input first, and keep a query out of baseUrl (pass it with the call)
      const dataSource = new HttpDataSource({ name: 'api', baseUrl: 'https://api.example.com/v1' });

      await dataSource.request({ paths: ['files', safeFileName], query: { download: '1' } });
    steps:
      - "Remove any query string or fragment from baseUrl in IHttpDataSourceSettings, passing query parameters with the call query option instead."
      - "Validate request paths and ids before passing them to HttpDataSource, rejecting backslashes, control characters, and dot segments."
      - "Ensure resolved request paths stay on the base origin and under the base path of HttpDataSource."
  downgrade:
    steps:
      - Pin @venizia/ignis-connectors and @venizia/ignis to 0.4.7, where a request path is joined to the base URL as it is.
      - Or stay on the new version and keep the checked input; it behaves the same on 0.4.7.
  data: Nothing stored changes. A request path with a . or .. segment (percent-encoded too), a backslash or a control character answers 400, and so does a URL that ends outside the base origin or base path. A baseUrl that holds ? or # makes the constructor throw, so the application stops at boot. An id that holds a backslash is refused.

fetch-guarded-pins-address:
  symbols: [UrlIngest.fetchGuarded, IUrlSafetyPolicy.proxy, IUrlSafetyPolicy.timeout]
  upgrade:
    before: |
      // egress went through the proxy the platform fetch read from HTTPS_PROXY
      const response = await UrlIngest.fetchGuarded({ url });
    after: |
      // the environment's HTTP_PROXY and HTTPS_PROXY are ignored; name the proxy in the policy
      const response = await UrlIngest.fetchGuarded({
        url,
        policy: { proxy: 'http://proxy.internal:3128' },
      });
    steps:
      - "Set policy.proxy explicitly on UrlIngest.fetchGuarded calls if egress must route through an outbound proxy."
      - "Point policy.proxy only at a proxy that refuses internal addresses, since address pinning is disabled when proxying."
      - "Increase policy.timeout on multi-hop redirect requests if the total duration now exceeds the budget for the whole call."
      - "Check the headers you pass: on a redirect that leaves the origin, any header other than accept, accept-language and user-agent is dropped."
  downgrade:
    steps:
      - Pin @venizia/ignis-helpers to 0.4.7, where fetchGuarded checks the host once and connects through the platform fetch, which reads the environment proxy.
      - Remove the method and body options you added, and policy.proxy; 0.4.7 sends a GET and takes only url, policy and headers.
  data: Nothing stored changes. With policy.proxy the address check still runs but the connection is not pinned, so point it at a proxy that refuses internal addresses. A caller header other than accept, accept-language and user-agent is dropped when a redirect leaves the origin, and timeout now counts the whole call, not each hop. An app that needs the environment proxy and sets no policy.proxy now connects direct, so a locked-down network times out.

service-assertion-not-user-token:
  symbols: [ServiceAssertion.TYP, ServiceAssertion.HEADER, AbstractBearerTokenService, IJWTVerifyOptions.algorithms, headerAlgorithm]
  upgrade:
    before: |
      # a service assertion (header typ svc+jwt) sent as a user token verified when a JWKS issuer shared its key
      curl -H "Authorization: Bearer $SERVICE_ASSERTION" https://api.example.com/orders
    after: |
      # the assertion has its own header; the bearer token stays a user token
      curl -H "x-service-assertion: $SERVICE_ASSERTION" -H "Authorization: Bearer $USER_TOKEN" https://api.example.com/orders

      // and a token service gets a verify object with real algorithms
      options: { jwtSecret, claims: { issuer: 'my-api' }, verify: { algorithms: ['HS256'] } }
    steps:
      - "Send service assertions using the x-service-assertion header instead of the Authorization Bearer header."
      - "Pass verify as an object in token service options."
      - "Specify real algorithms in headerAlgorithm or verify.algorithms instead of none."
  downgrade:
    steps:
      - Pin @venizia/ignis to 0.4.7, where bearer and JWKS verification accept a token whose typ is svc+jwt and a malformed verify option is ignored.
      - Do not send assertions as bearer tokens on 0.4.7 either; the x-service-assertion header works on both versions.
  data: Nothing stored changes. A bearer or JWKS call that sends a service assertion as its user token now gets 401. A verify option that is not an object, or the algorithm none in headerAlgorithm or verify.algorithms, stops the boot with a message that names the option.

upload-file-count-and-spool-cleanup:
  symbols: [TStaticAssetServerUploadOptions.maxFiles, TStaticAssetDirectUploadOptions.maxFiles, StaticAssetDefaults.MAX_UPLOAD_FILES, RequestUtility.parseMultipartBody, RequestBodyErrors.TOO_MANY_FILES, serverUpload, directUpload]
  upgrade:
    steps:
    - "A client that uploads more than 20 files in one request gets 413 core.request.too_many_files. Set serverUpload.maxFiles to the number you accept (the entry shape itself is the static-asset-entry-flat item)."
    - "A client that asks for more than 20 upload policies at once gets 422. Set directUpload.maxFiles to the number you accept."
    - "A route of your own that calls RequestUtility.parseMultipartBody applies no count unless you pass maxFiles, so add maxFiles there if you want one. With storage 'disk' the call now removes its spool files when it fails; delete any cleanup of your own for that case."
  downgrade:
    steps:
    - Pin @venizia/ignis and @venizia/ignis-helpers to 0.4.7, where an upload request has no file-count ceiling and a failed disk parse leaves its spool files behind.
    - Remove maxFiles from serverUpload, directUpload and parseMultipartBody calls (0.4.7 has no such option).
  data: Nothing stored changes. The default is StaticAssetDefaults.MAX_UPLOAD_FILES, 20. The count is checked before anything is written, so a refused request leaves no object and no spool file behind.

disk-helper-path-containment:
  symbols: [DiskHelper, DiskHelper.writeStream, DiskHelper.createBucket, DiskHelper.hasBucket, IWriteStreamOptions.maxFolderDepth]
  upgrade:
    before: |
      // writeStream created the bucket folder on the way
      await helper.writeStream({ bucket: { name: 'exports' }, object: { key: 'a.csv' }, source: stream });
    after: |
      // create the bucket first: writeStream refuses a bucket that does not exist, as upload does
      const bucket = { name: 'exports' };

      if (!(await helper.hasBucket({ bucket }))) {
        await helper.createBucket({ bucket });
      }

      await helper.writeStream({ bucket, object: { key: 'a.csv' }, source: stream });
    steps:
      - "Check with DiskHelper.hasBucket and create missing buckets with DiskHelper.createBucket before calling DiskHelper.writeStream."
      - "Move symbolic link targets inside the storage root or set basePath directly to the real folder."
      - "Check code that treats a directory or any other entry that is not a regular file as an object: DiskHelper no longer does."
      - "Ensure keys passed to DiskHelper.writeStream stay within IWriteStreamOptions.maxFolderDepth and pass bucket name validation."
  downgrade:
    steps:
      - Pin @venizia/ignis-helpers and @venizia/ignis to 0.4.7, where DiskHelper does not follow links for containment and writeStream creates a missing bucket folder.
      - Remove the createBucket calls you added if you want writeStream to create folders again.
  data: A storage root whose bucket or object path is a symbolic link leading outside the root now fails with Invalid object name; move the data under the root or point basePath at the real folder. A directory or any entry that is not a regular file is no longer an object. writeStream validates the bucket name and the key, with the folder depth limit, like every other call. A failure to resolve a real path reports the error code, never the absolute path.

s3-virtual-hosted-object-calls:
  symbols: [BunS3Helper, IBunS3HelperOptions.virtualHostedStyle, BunS3Helper.upload, BunS3Helper.writeStream, BunS3Helper.getObject, BunS3Helper.getObjectStream, BunS3Helper.getStat, BunS3Helper.removeObject, BunS3Helper.listObjects, BunS3Helper.hasBucket, BunS3Helper.presignGet, BunS3Helper.presignPut, BunS3Helper.presignPost]
  upgrade:
    before: |
      // virtual-hosted style with a bucket that is not one DNS label was passed into the host unchecked
      const helper = new BunS3Helper({
        accessKey,
        secretKey,
        endpoint: { default: 'https://s3.example.com' },
        virtualHostedStyle: true,
      });

      await helper.presignGet({ bucket: { name: 'logs.2026' }, object: { key: 'a.txt' } });
    after: |
      // a bucket in a host is one lower-case DNS label: 1 to 63 characters of a-z, 0-9 and hyphen
      await helper.presignGet({ bucket: { name: 'logs-2026' }, object: { key: 'a.txt' } });

      // or keep the bucket name and use path style
      const pathStyleHelper = new BunS3Helper({
        accessKey,
        secretKey,
        endpoint: { default: 'https://s3.example.com' },
        virtualHostedStyle: false,
      });
    steps:
      - "Check that the endpoint resolves bucket subdomains, with DNS and a wildcard certificate, wherever BunS3Helper has virtualHostedStyle true."
      - "Rename buckets used with virtualHostedStyle to valid DNS labels containing only lowercase letters, numbers, and hyphens up to 63 characters."
      - "Set virtualHostedStyle to false on BunS3Helper instances targeting endpoints that only serve path style or using bucket names with dots or uppercase letters."
  downgrade:
    steps:
      - Pin @venizia/ignis-helpers and @venizia/ignis to 0.4.7, where the bucket name is not checked as a host label and object calls with virtualHostedStyle true go to the bare endpoint.
      - Or stay on the new version and set virtualHostedStyle to false for a bucket with a dot or an upper-case letter.
  data: Nothing stored changes. With virtualHostedStyle true the object calls now go to https://{bucket}.{endpoint}/{key}, so the endpoint must resolve bucket subdomains (DNS and a wildcard certificate); an endpoint that serves only path style, such as a default MinIO, needs virtualHostedStyle false. A bucket that is not one DNS label throws before a URL is built, presigned URLs included.

where-depth-limit:
  symbols: [QuerySchemaFactory.build, limits.whereDepth]
  upgrade:
    before: |
      // a where nested 25 levels deep in and / or was accepted
      const schema = QuerySchemaFactory.build();
    after: |
      // more than 20 levels is a validation issue: flatten the filter, or raise the limit
      const schema = QuerySchemaFactory.build({ limits: { whereDepth: 40 } });
    steps:
      - "Find client queries that send where filters nested more than 20 levels deep in and/or conditions."
      - "Flatten or split deeply nested where filters in client requests to stay within 20 levels."
      - "Pass limits: { whereDepth } to QuerySchemaFactory.build where controllers require deeper nesting."
  downgrade:
    steps:
      - Pin @venizia/ignis-filter to 0.4.6, the last stable release without the depth check (this package has no 0.4.7 stable tag).
      - Remove the limits option from QuerySchemaFactory.build calls.
  data: Nothing stored changes. A client that sends a where with more than 20 levels of and / or nesting now gets a validation error instead of a result. The default 20 applies to every controller that builds its schema with the factory.

blank-line-padding-rules:
  symbols: [houseConfigs, reactHouseConfigs, eslintConfigs, paddingConfigs, '@stylistic/padding-line-between-statements', '@stylistic/lines-between-class-members']
  upgrade:
    before: |
      // .configs/lints/eslint.config.mjs
      import { houseConfigs } from '@venizia/dev-configs/linters';

      export default houseConfigs;
    after: |
      // the file is unchanged: the preset now carries paddingConfigs. Fix the code once:
      //   bun run devz lint --fix
      import { houseConfigs } from '@venizia/dev-configs/linters';

      export default houseConfigs;
    steps:
      - "Run bun run devz lint --fix once to automatically insert the required blank-line padding."
      - "Commit the generated blank-line formatting changes apart from other changes."
      - "Run bun run devz lint to confirm houseConfigs, reactHouseConfigs, or eslintConfigs pass without errors."
  downgrade:
    steps:
      - Pin @venizia/dev-configs to 0.4.7, which has no padding rules and does not depend on @stylistic/eslint-plugin.
      - "Or stay on the new version and turn the two rules off in a config object after the preset: set '@stylistic/padding-line-between-statements' and '@stylistic/lines-between-class-members' to 'off'."
  data: Nothing stored changes. houseConfigs, reactHouseConfigs and eslintConfigs report a missing blank line after imports, before a return, between class members and around block-like statements at error, so the lint fails until you run bun run devz lint --fix. The fix only adds blank lines; commit it apart from other changes. oxlint has no port of these rules.


any-aliases-removed:
  symbols: [AnyType, AnyObject]
  codemod: any-aliases
  upgrade:
    before: |-
      import type { AnyObject, AnyType } from '@venizia/ignis-helpers';

      // a bag of values read later
      const headers: Record<string, AnyType> = {};
      headers['x-id'].toUpperCase();

      // a generic default
      interface IResult<TData = AnyType> { data: TData }

      // a parameter
      const log = (value: AnyType) => console.log(value);
      const pick = (source: AnyObject, key: string) => source[key];

      // a generic default over objects
      interface IPage<TItem extends AnyObject = AnyObject> { items: TItem[] }

      // a decorator target, from the inversion package
      import type { AnyType as TInversionAny } from '@venizia/ignis-inversion';
      const decorate = (target: TInversionAny) => Reflect.getMetadata('design:type', target);
    after: |-
      // bun run devz codemod any-aliases writes what the aliases stood for, so no type changes and nothing new fails
      const headers: Record<string, any> = {};
      headers['x-id'].toUpperCase();

      interface IResult<TData = any> { data: TData }

      const log = (value: any) => console.log(value);
      const pick = (source: Record<string | symbol | number, any>, key: string) => source[key];

      interface IPage<TItem extends Record<string | symbol | number, any> = Record<string | symbol | number, any>> { items: TItem[] }

      // the inversion package no longer exports AnyType; a decorator target is an object, and the codemod writes any
      const decorate = (target: any) => Reflect.getMetadata('design:type', target);

      // To stop using any: run --strict instead of the default run, or write it by hand. unknown, and narrow what you read
      const strictHeaders: Record<string, unknown> = {};
      const id = strictHeaders['x-id'];
      if (typeof id === 'string') {
        id.toUpperCase();
      }

      interface IStrictResult<TData = unknown> { data: TData }

      const strictLog = (value: unknown) => console.log(value);

      // An interface-typed argument needs an index signature (see interface-values-and-record-unknown):
      // declare the shape as a type alias, or take object and read with Reflect.get
      const strictPick = (source: object, key: string): unknown => Reflect.get(source, key);

      const strictDecorate = (target: object) => Reflect.getMetadata('design:type', target);
    steps:
      - "Run `bun run devz codemod any-aliases [paths...] --write` (or `--all`) to rewrite `AnyType` and `AnyObject` imports to `any` and `Record<string | symbol | number, any>`."
      - "Pass `--strict` if you want to rewrite the aliases to `unknown` and `Record<string, unknown>` instead."
      - "Update any re-export, `import()` type, or heritage clause listed by the codemod as manual by hand."
      - "Run `bun run devz codemod any-aliases [paths...] --check` to verify that no files would change and no manual cases remain."
  downgrade:
    steps:
      - "Declare the aliases in your own code and import them from there: `export type AnyType = any;` and `export type AnyObject = Record<string | symbol | number, any>;`."
  data: "Types only; nothing changes at run time. bun run devz codemod any-aliases --write rewrites AnyType to any and AnyObject to Record<string | symbol | number, any> in every file that imports them from @venizia/ignis, @venizia/ignis-helpers, @venizia/ignis-inversion, @venizia/ardor or @venizia/ardor-kernel, so no type in your code changes; --strict instead of the default run writes unknown and Record<string, unknown>, and acts only on the alias names (a file already rewritten to any is left alone). It lists a re-export, an import() type and a heritage clause as manual, and a same-named local type as local."

interface-values-and-record-unknown:
  symbols: [AnyType, AnyObject]
  upgrade:
    before: |-
      // when you tighten AnyObject to Record<string, unknown> (--strict instead of the default run, or by hand), an interface-typed value no longer fits it
      interface IUser { id: number; name: string }
      declare const user: IUser;

      const save = (data: Record<string, unknown>) => data;
      save(user); // TS2345: Index signature for type 'string' is missing in type 'IUser'

      const bag: Record<string, unknown> = user; // TS2322: the same reason
    after: |-
      // declare the shape as a type alias (it has an implicit index signature), or spread the value,
      // or take object when the function only reads known keys through Reflect.get
      interface IUser { id: number; name: string }
      declare const user: IUser;

      type TUser = { id: number; name: string };
      declare const typedUser: TUser;

      const save = (data: Record<string, unknown>) => data;
      save(typedUser);
      save({ ...user });

      const bag: Record<string, unknown> = typedUser;
    steps:
      - "If you tighten the aliases (`--strict` or by hand), find the TS2345 or TS2322 errors on interface-typed values passed where `Record<string, unknown>` is expected."
      - "Declare that interface's shape as a type alias, which has the implicit index signature."
      - "Or spread the interface-typed value into a new object at the call site."
      - "Or type the parameter `object` and read its properties with `Reflect.get`."
  downgrade:
    steps:
      - "Write Record<string | symbol | number, any> again (it is what the codemod writes by default); an interface fits it."
  data: The codemod writes any, so a bag that holds interface-typed values keeps compiling. When you tighten (--strict instead of the default run, or by hand), a variable typed with an interface is not assignable to Record<string, unknown>, because an interface has no implicit index signature. A type alias has one. Types only.

inject-target-is-object:
  symbols: [inject]
  upgrade:
    before: |-
      // a wrapper that forwards the decorator's target typed unknown (or an unconstrained generic)
      const injectKey =
        (key: string) => (target: unknown, name: string | symbol | undefined, index?: number) =>
          inject({ key })(target, name, index); // TS2345: Argument of type 'unknown' is not assignable to parameter of type 'object'
    after: |-
      // inject() returns a decorator whose target is typed object (it was any); a class and a prototype both fit.
      // Type the wrapper's target object, or T extends object
      const injectKey =
        (key: string) => (target: object, name: string | symbol | undefined, index?: number) =>
          inject({ key })(target, name, index);
    steps:
      - "Inspect wrapper functions that forward arguments to inject."
      - "Update the target parameter type from unknown or unconstrained generic types to object or T extends object."
      - "Recompile the application and resolve any TS2345 errors on forwarded inject decorator targets."
  downgrade:
    steps:
      - "Type the wrapper's target as unknown again; a decorator whose target is typed object fits the older any."
  data: Every direct use of @inject() on a property or a constructor parameter compiles unchanged.

generated-index-types:
  symbols: [AutoArtifactGroup, TGeneratedArtifactIndex, TGeneratedArtifactIndexInput]
  upgrade:
    before: |-
      // TGeneratedArtifactIndex listed TClass<any>: any class fit
      const index: TGeneratedArtifactIndex = { services: [FooService] }; // TS2322 now

      // a group typed without its content type: the classes read from content were TClass<any>
      declare const group: AutoArtifactGroup;
      const serviceClass = group.content?.services?.[0];
      if (serviceClass) {
        new serviceClass().run(); // TS2339 now: the instance type is never
      }
    after: |-
      // the generated index lists TClass<never>, the bottom boot moves around without knowing your classes;
      // to write an index by hand, check it against the input type and keep its exact type
      const index = { services: [FooService] } satisfies TGeneratedArtifactIndexInput;
      const group: IArtifactGroup = new AutoArtifactGroup({ content: index });

      // build the group from a typed index and let TIndex be inferred, so content keeps your classes
      const typedGroup = new AutoArtifactGroup({ content: { services: [FooService] } });
      const typedClass = typedGroup.content?.services?.[0];
      if (typedClass) {
        new typedClass().run();
      }
    steps:
      - "Replace variable annotations of TGeneratedArtifactIndex with satisfies TGeneratedArtifactIndexInput on hand-written index objects."
      - "Pass typed content or resolve directly when constructing AutoArtifactGroup so TIndex is inferred and retains class types."
      - "Type constructed groups as IArtifactGroup where only the kernel interface is required."
  downgrade:
    steps:
      - Pin @venizia/ignis-boot to 0.4.7, where TGeneratedArtifactIndex lists TClass<any> per kind and AutoArtifactGroup takes no type argument.
  data: Types only. A group boot builds itself (the default export of @venizia/ignis-boot/auto and the modules the plugins emit) is still the kernel's IArtifactGroup; only reading its classes through the default type changed.

http-repository-row-type:
  symbols: [HttpRepository, HttpRepository.patchWhere, HttpRepository.deleteWhere]
  upgrade:
    before: |-
      // E defaulted to any: field names and returned rows were unchecked
      const repository = new HttpRepository({ resource: 'articles', dataSource });
      const created = await repository.create({ data: { title: 'x' } });
      created.data.title; // any
      await repository.find({ filter: { where: { title: 'x' } } });
    after: |-
      // name the row type: E defaults to object, so the returned rows carry no properties and no field name is accepted
      const repository = new HttpRepository<IArticle>({ resource: 'articles', dataSource });
      const created = await repository.create({ data: { title: 'x' } });
      created.data.title;
      await repository.find({ filter: { where: { title: 'x' } } });
    steps:
      - "Pass the row type when you instantiate HttpRepository, as in new HttpRepository<IArticle>(...)."
      - "If a find fails with a TDataWithRange error or \"'id' does not exist in type 'TWhere<object>'\", name the row type."
      - "Give a subclass that reads .data.x from patchWhere, deleteWhere or search() the row type, or narrow the value first."
  downgrade:
    steps:
      - Pin @venizia/ignis-connectors to 0.4.7 and drop the type argument; the older default let every read and every field name compile.
  data: "An error about TDataWithRange on a find, or an excess property such as `'id' does not exist in type 'TWhere<object>'`, means the entity type is not named: write HttpRepository<IEntity>, because with the default object entity no field name is accepted in where, no overload matches, and the call falls through to the ranged result. The protected patchWhere and deleteWhere now answer data: unknown, and search() answers IHttpSearchResult<object> without a row type: a subclass that reads .data.x from them needs the row type or a narrow. Reading find() rows without a type argument still compiles (a keyless object selects any). Types only."

raw-sql-repository-datasource-type:
  symbols: [BaseRawSqlRepository]
  upgrade:
    before: |-
      class ReportRepository extends BaseRawSqlRepository {
        rows() { return this.dataSource.settings.schema; } // any
      }
    after: |-
      // dataSource is BaseRawSqlDataSource<object, unknown, TConnector>: read settings through your own datasource type
      class ReportRepository extends BaseRawSqlRepository {
        constructor(readonly reports: ReportDataSource) { super(reports); }
        rows() { return this.reports.settings.schema; }
      }
    steps:
      - "Hold your own datasource under its type in a constructor property of each BaseRawSqlRepository subclass."
      - "Replace reads of this.dataSource.settings with reads from your own datasource property."
  downgrade:
    steps:
      - Pin @venizia/ignis-connectors to 0.4.7 and read this.dataSource.settings directly again; it was typed any.
  data: Types only.

driver-datasource-secret-mapping:
  symbols: [AbstractDriverDataSource, AbstractDriverDataSource.mapSecretToSettings]
  upgrade:
    before: |-
      // the protected hook returned AnyObject: an interface return and any property read compiled
      interface IPgSecret { user: string; password: string }
      class MyDataSource extends AbstractDriverDataSource<ISettings, Schema, {}, Client, Connector, MyDriver> {
        protected override mapSecretToSettings(opts: { secret: Record<string, string> }): IPgSecret { /* ... */ } // TS2416 now
      }
      const user = this.mapSecretToSettings({ secret }).user.toLowerCase();
    after: |-
      // it returns Record<string, unknown>: return that (or declare the shape as a type alias) and narrow what you read;
      // the TDriver constraint is IConnectorDriver<TConnector, unknown>
      type TPgSecret = { user: string; password: string };
      class MyDataSource extends AbstractDriverDataSource<ISettings, Schema, {}, Client, Connector, MyDriver> {
        protected override mapSecretToSettings(opts: { secret: Record<string, string> }): TPgSecret { /* ... */ }
      }
      const mapped = this.mapSecretToSettings({ secret });
      const user = typeof mapped.user === 'string' ? mapped.user.toLowerCase() : undefined;
    steps:
      - "Change any interface returned by AbstractDriverDataSource.mapSecretToSettings overrides to a type alias or Record<string, unknown>."
      - "Narrow property types when reading from the settings returned by AbstractDriverDataSource.mapSecretToSettings before using them."
  downgrade:
    steps:
      - Pin @venizia/ignis-connectors to 0.4.7, return the interface, and read the mapped settings without a narrow again; the older return was any-valued.
  data: Types only.

controller-definitions-typed:
  symbols: [AbstractSearchController, AbstractCrudController, CrudControllerFactory]
  upgrade:
    before: |-
      // definitions was any: an interface-typed object fit
      interface ISearchDefinitions { search: IAuthRouteConfig }
      declare const searchRoute: IAuthRouteConfig;
      const definitions: ISearchDefinitions = { search: searchRoute };
      super({ scope: 'SearchController', repository, definitions }); // TS2322 now: no index signature
    after: |-
      // definitions is Record<string, IAuthRouteConfig>: use a type alias or satisfies
      const definitions = { search: searchRoute } satisfies Record<string, IAuthRouteConfig>;
      super({ scope: 'SearchController', repository, definitions });

      // the CRUD controller takes the same type, and the repository as AbstractRepository<D, P> with its default options;
      // the shipped relational and search repositories, whose options narrow IExtraOptions, still fit
      const crudDefinitions: Record<string, IAuthRouteConfig> = loadDefinitions();
      super({ scope: 'ItemController', repository, definitions: crudDefinitions });
    steps:
      - "Replace interface declarations for controller definitions passed to AbstractSearchController or AbstractCrudController with a type alias or satisfies Record<string, IAuthRouteConfig>."
      - "Check that a custom repository passed to a CRUD controller does not narrow IExtraOptions in a way a method cannot accept."
  downgrade:
    steps:
      - Pin @venizia/ignis-kernel and @venizia/ignis-connectors to 0.4.7, where definitions is any. A definitions object that fits the newer type fits the older one.
  data: A repository whose own options narrow IExtraOptions in a way a method cannot accept bivariantly fails to type-check at the controller's constructor; the shipped repositories were checked. Types only.

meilisearch-polled-task:
  symbols: [IMeilisearchClientLike, IMeilisearchPolledTask, IMeilisearchTask]
  upgrade:
    before: |-
      const task = await client.getTask(7);
      const id: number = task.taskUid; // IMeilisearchTask.taskUid was required
    after: |-
      // getTask answers IMeilisearchPolledTask: the SDK names the id uid, so taskUid may be absent
      const task = await client.getTask(7);
      const id: number | undefined = task.taskUid;
    steps:
