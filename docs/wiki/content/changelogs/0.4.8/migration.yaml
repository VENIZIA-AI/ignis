      const options: IApiReferenceOptions = { securitySchemes: schemes };
    steps:
      - "Check that each securitySchemes entry in IApiReferenceOptions is an OpenAPI apiKey, http, oauth2 or openIdConnect scheme, or a reference to one."
      - "Type a separately built schemes record as Record<string, TApiReferenceSecurityScheme>, imported from @venizia/ignis."
  downgrade:
    steps:
      - Pin @venizia/ignis to 0.4.7 and type the schemes as Record<string, Record<string, any>> again; every scheme that fits the newer type fits it.
