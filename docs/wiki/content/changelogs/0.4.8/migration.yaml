      type TUserQuery = { id: number };

      class MyAuthService implements IAuthService {
        async signIn(context: TContext, opts: TSignInRequest): Promise<TSignInResult> { /* ... */ }
        async signUp(context: TContext, opts: TSignUpRequest) { /* ... */ }
        async changePassword(context: TContext, opts: TChangePasswordRequest) { /* ... */ }
        async getUserInformation(context: TContext, opts: TUserQuery) { /* ... */ }
      }

      await service.getUserInformation?.(context, userQuery); // userQuery: TUserQuery
    steps:
      - "Convert request and response shapes from interface declarations to type aliases, or pass them explicitly as type arguments to IAuthService."
      - "Update IAuthService implementation method signatures and return types to use the type aliases."
      - "Pass the updated type-aliased values at call sites such as getUserInformation."
  downgrade:
    steps:
      - Pin @venizia/ignis-kernel and @venizia/ignis to 0.4.7, or drop the type arguments or the aliases; the older defaults were any-valued records, so interfaces and every read compiled.
  data: Types only.

query-operator-handler-types:
  symbols: [TQueryOperatorHandlers, IQueryHandlerOptions]
  upgrade:
    before: |-
      const handlers: TQueryOperatorHandlers = {
        // opts was { column: any; value: any }, and IQueryHandlerOptions.column was a Column
        byName: (opts) => sql`${sql.identifier(opts.column.name)} = ${opts.value}`,
        lengthIs: (opts) => sql`length(${opts.column}) = ${opts.value.length}`,
        startsWith: (opts) => like(opts.column, `${opts.value}%`),
      };
    after: |-
      // opts.column is an SQLWrapper (a Column, or the raw #> extraction the JSON path passes) and opts.value is unknown:
      // pass the column to a template or an operator, and narrow the value. The like family (like, notLike, ilike,
      // notIlike) takes a Column, an SQL or an SQL.Aliased only: wrap the column in a template
      const handlers: TQueryOperatorHandlers = {
        lengthIs: (opts) =>
          typeof opts.value === 'string' ? sql`length(${opts.column}) = ${opts.value.length}` : undefined,
        startsWith: (opts) => like(sql`${opts.column}`, `${opts.value}%`),
      };
    steps:
      - "Narrow `opts.value` in your `TQueryOperatorHandlers` handlers before using it."
      - "For `like`, `notLike`, `ilike` and `notIlike`, wrap `opts.column` in a template, as in sql`${opts.column}`."
      - "Update any helper that accepted `Column | SQL` for the handler's column to accept `SQLWrapper`."
  downgrade:
    steps:
      - Pin @venizia/ignis-kernel and @venizia/ignis-connectors to 0.4.7, or type the handler's parameters as any again.
  data: A helper that takes the handler's column as Column | SQL (such as a Postgres array comparison) takes SQLWrapper now; every drizzle operator except the like family accepts it. Types only; the SQL the shipped handlers build is unchanged.

filter-builder-hook-types:
  symbols: [FilterBuilder, buildValueCondition, buildOperatorConditions, toOperatorObject, isOperatorObject]
  upgrade:
    before: |-
      class MyFilterBuilder extends FilterBuilder {
        protected override buildValueCondition(opts: { column: any; value: any }): SQL { ... }
        protected override buildOperatorConditions(opts: { column: any; value: Record<string, any> }): SQL[] { ... }
      }
    after: |-
      // the protected hooks take column: AnyColumn | SQL and value: unknown (Record<string, unknown> for operators);
      // an SQL.Aliased no longer type-checks as a column. toOperatorObject is new: it answers the operator record or undefined.
      class MyFilterBuilder extends FilterBuilder {
        protected override buildValueCondition(opts: { column: AnyColumn | SQL; value: unknown }): SQL { ... }
        protected override buildOperatorConditions(opts: {
          column: AnyColumn | SQL;
          value: Record<string, unknown>;
        }): SQL[] { ... }
      }
    steps:
      - "Type overrides of buildValueCondition and buildOperatorConditions with column: AnyColumn | SQL and value: unknown (Record<string, unknown> for operators)."
      - "Stop passing an SQL.Aliased to the hooks as a column."
      - "Use the new toOperatorObject in an override when you need an operand as an operator record or undefined."
  downgrade:
    steps:
      - Pin @venizia/ignis-connectors to 0.4.7, or type the overrides' column and value as any again; the older signatures accepted them.
  data: Types only.

update-builder-types:
  symbols: [PersistableRelationalRepository, IRelationalQueryDialect, ITransformedUpdateData, RelationalUpdateBuilder, getVisibleProperties]
  upgrade:
    before: |-
      repository.updateBuilder.transform({ data }); // deprecated getter, typed any

      const { regularFields } = builder.transform({ data });
      const name: string = regularFields.name; // any

      const visible = repository.getVisibleProperties(); // Record<string, any> | undefined
    after: |-
      // the getter answers RelationalUpdateBuilder | undefined: check it, or use the dialect's own
      const updateBuilder = repository.updateBuilder;

      if (updateBuilder) {
        updateBuilder.transform({ data });
      }

      const { regularFields } = builder.transform({ data });
      const name = typeof regularFields['name'] === 'string' ? regularFields['name'] : undefined;
      // a builder subclass overriding a hook typed any still compiles: the hooks take unknown now

      // a Record<string, AnyColumn> | undefined: the columns a read exposes
      const visible = repository.getVisibleProperties();
    steps:
      - "Check `repository.updateBuilder` for undefined before calling its methods, or access it from the dialect."
      - "Narrow values read from `ITransformedUpdateData.regularFields` before treating them as concrete types."
      - "Handle `getVisibleProperties()` returning `Record<string, AnyColumn> | undefined` instead of any values."
  downgrade:
    steps:
      - Pin @venizia/ignis-connectors to 0.4.7, or call repository.updateBuilder directly and read regularFields and the visible properties without a narrow again; the older types were any.
  data: Types only.

dialect-merge-defaults-removed:
  symbols: [IRelationalQueryDialect, ScopeFilterDenial, ScopeResolution, PersistableRelationalRepository]
  upgrade:
    before: |-
      const merged = dialect.mergeFilter({ defaultFilter, userFilter }); // T defaulted to any
    after: |-
      // name the row type
      const merged = dialect.mergeFilter<IRow>({ defaultFilter, userFilter });
      // ScopeFilterDenial.where<IRow>() and ScopeResolution.normalize<IRow>() name the row type too;
