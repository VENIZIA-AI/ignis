bearer-payload-encryption-unknown:
  symbols: [AbstractBearerTokenService.encryptPayload, AbstractBearerTokenService.decryptPayload, AbstractBearerTokenService.serializeField, AbstractBearerTokenService.applySignClaims]
  upgrade:
    before: |-
      // a subclass that calls the protected hook with an interface-typed payload, or overrides it typed on an interface
      interface ITokenPayload { sub: string; tenant: string }
      abstract class MyTokenService extends AbstractBearerTokenService {
        issue(signer: SignJWT, payload: ITokenPayload) {
          return this.applySignClaims({ signer, payload }); // TS2322 now: no index signature
        }
      }
    after: |-
      // the payload is Record<string, unknown>: spread the interface value, or declare the shape as a type alias
      abstract class MyTokenService extends AbstractBearerTokenService {
        issue(signer: SignJWT, payload: ITokenPayload) {
          return this.applySignClaims({ signer, payload: { ...payload } });
        }
      }
  downgrade:
    steps:
      - "Pin @venizia/ignis to 0.4.7, or return Promise<Record<string, any>> and take value: any again in the overrides, and pass an interface-typed payload to applySignClaims directly."
  data: "A subclass that overrides encryptPayload returns Promise<Record<string, unknown>>, and one that overrides serializeField takes value: unknown. With applicationSecret configured (AES on), decryptPayload answers 401 when an encrypted claim is not a string or the decrypted claims carry no userId; a token this service issued always has both, so tokens already issued decode the same. Without AES nothing changes."

