      - "Update callers reading taskUid to accept or handle undefined."
  downgrade:
    steps:
      - Pin @venizia/ignis-connectors to 0.4.7, where getTask answers IMeilisearchTask. A getTask implementation that carries taskUid fits both types.
  data: A caller that reads taskUid from a polled task must handle undefined. The real SDK never set it, so a message that printed it showed undefined before as well.

api-reference-security-schemes:
  symbols: [IApiReferenceOptions, TApiReferenceSecurityScheme]
  upgrade:
    before: |-
      const schemes: Record<string, Record<string, any>> = loadSchemes(); // any object fit
      const options: IApiReferenceOptions = { securitySchemes: schemes };
    after: |-
      // a scheme is a real OpenAPI security scheme (apiKey, http, oauth2, openIdConnect) or a reference to one
      const schemes: Record<string, TApiReferenceSecurityScheme> = {
        bearer: { type: 'http', scheme: 'bearer', bearerFormat: 'JWT' },
