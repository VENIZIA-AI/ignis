        data: { name: 'Ada', title: { en: 'Dr', vi: 'Bs' } },
      });
      // 'Hi Ada, {{reason}} [object Object]'
    after: |-
      import { MailTemplateMissingModes } from '@venizia/ignis/mail';

      // resolve the locale first; a missing key renders empty
      const html = templateEngine.render({
        templateData: 'Hi {{name}}, {{reason}} {{title}}',
        data: { name: 'Ada', title: title[locale] },
      });
      // 'Hi Ada,  Dr'

      // the old output, while you migrate
      templateEngine.render({ templateData, data, missing: MailTemplateMissingModes.KEEP });
    steps:
      - "A template that relied on a missing key staying as {{key}} (to spot it in a test mail) passes missing: 'keep', or fails loudly with missing: 'throw' (or requireValidate: true to list every missing key)."
      - "A value that is an object, an array or a Date in a {{key}} slot now throws core.mail.template_invalid. Resolve the locale ({ en, vi } to the string of the recipient's locale) and format dates in your code before render() or sendTemplate()."
      - "A value that is a function throws core.mail.template_invalid; call it and pass the result."
      - "Text that was literal before has a meaning now. {{#x}} and {{^x}} open a section (a template with one and no {{/x}} throws); {{/x}}, {{! x}}, {{> x}}, {{= x =}} and {{& x}} throw core.mail.template_invalid, where they used to be printed as text. To keep one as literal text, pass it as data and insert it with triple braces: data { note: '{{! kept }}' } and the template {{{note}}} (a value is never parsed as a template)."
      - "A {{ that is no tag ('{{ not a tag }}', a lone '{{') is still left as written."
      - "Sections nest to 64; a deeper template throws core.mail.template_invalid."
      - "A render that leaves a value empty now logs one warning with the keys (never the values): a template that renders empty on purpose can pass missing: 'keep' or give the key a value."
